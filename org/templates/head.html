<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>try{var t=localStorage._theme;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="/site.css">
<script defer src="/theme.js"></script>
<meta name="theme-color" content="#0B0B0A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F6F2E8" media="(prefers-color-scheme: light)">
<script defer src="https://antics-api.turtletech.us/antics.js"></script>
<script>window.antics=window.antics||{event:function(){}};document.addEventListener("click",function(e){var a=e.target.closest("a");if(a&&a.hostname&&a.hostname!==location.hostname)antics.event("Outbound Link",{url:a.href});});</script>
